<!--
  addRoom.html

  CSS:  base.css, components.css, admin.css
  JS:   nav.js  (renders sidebar, provides filterTable / stepper)
-->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalFit — Dodanie sali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
<script>
  const PAGE_ID = 'addRoom';
  const ROLE    = 'admin';
</script>

<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">Sal<span>Fit</span></div>
    <span class="topbar-user">Jan Kowalski (admin)</span>
    <a class="topbar-link" href="../login.html">Wyloguj</a>
    <a class="topbar-link" href="../changePassword.html">Zmień hasło</a>
  </header>

  <div class="shell">
    <!-- Sidebar — populated by nav.js renderSidebar() -->
    <nav class="sidebar" id="sidebar"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Dodanie sali</h1>
        <a class="btn btn-ghost back-btn" href="manageRooms.html">← Cofnij</a>
      </div>
      <div class="card" style="max-width:720px">
        <div class="form-grid">
          <div class="form-group">
            <label class="field-label">Nazwa sali <span class="req">*</span></label>
            <input class="field" type="text" placeholder="np. Sala E">
          </div>
          <div class="form-group">
            <label class="field-label">Kod sali <span class="req">*</span></label>
            <input class="field" type="text" placeholder="np. S-005">
          </div>
          <div class="form-group">
            <label class="field-label">Typ sali</label>
            <select class="field"><option>Ogólna</option><option>Siłownia</option><option>Spinning</option><option>Basen</option></select>
          </div>
          <div class="form-group">
            <label class="field-label">Limit uczestników <span class="req">*</span></label>
            <div class="stepper">
              <button onclick="stepper(this,-1)">−</button>
              <input type="number" value="20" min="1">
              <button onclick="stepper(this,1)">+</button>
            </div>
          </div>
          <div class="form-group">
            <label class="field-label">Minimalna przerwa między zajęciami</label>
            <div class="stepper">
              <button onclick="stepper(this,-5)">−</button>
              <input type="number" value="15" min="0" step="5">
              <button onclick="stepper(this,5)">+</button>
            </div>
            <span class="field-hint">minut</span>
          </div>
          <div class="form-group">
            <label class="field-label">Status</label>
            <select class="field"><option>Dostępna</option><option>Zajęta</option><option>W remoncie</option></select>
          </div>
          <div class="form-group full">
            <label class="field-label">Opis stanu technicznego sprzętu</label>
            <textarea class="field" rows="3" placeholder="Opis wyposażenia…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" href="manageRooms.html">Anuluj</a>
          <div class="spacer"></div>
          <a class="btn btn-primary" href="manageRooms.html">Dodaj salę</a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../js/nav.js"></script>
</body>
</html>
