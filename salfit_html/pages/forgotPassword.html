<!--
  forgotPassword.html — Password reset request screen.

  The user enters their e-mail address. On submission a confirmation message
  is shown in place of the form (simulated in the prototype by toggling
  the .hidden CSS class via JavaScript).

  CSS:  base.css, components.css, auth.css
-->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalFit — Resetowanie hasła</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    /* Toggle helper — JS adds/removes this class to swap form ↔ success */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="auth-page">

  <div class="auth-logo">
    <div class="logo">Sal<span>Fit</span></div>
  </div>

  <div class="auth-card">
    <h2>Resetowanie hasła</h2>
    <p class="auth-desc">
      Podaj adres e-mail powiązany z Twoim kontem. Wyślemy na niego
      link umożliwiający ustawienie nowego hasła.
    </p>

    <!-- ── Reset request form (hidden after submission) ──── -->
    <div id="reset-form">
      <div class="form-group">
        <label class="field-label">Adres e-mail <span class="req">*</span></label>
        <input id="email-field" class="field" type="email"
               placeholder="adres@email.pl" autocomplete="email">
      </div>

      <button class="btn btn-primary" onclick="submitReset()">
        Wyślij link resetujący
      </button>
    </div>

    <!-- ── Confirmation message (hidden until form is submitted) ── -->
    <div id="reset-success" class="hidden">
      <div class="auth-success">
        Link do resetowania hasła został wysłany na podany adres e-mail.
        Sprawdź swoją skrzynkę i kliknij link w wiadomości.
      </div>
      <button class="btn btn-ghost" onclick="location.href='login.html'">
        ← Wróć do logowania
      </button>
    </div>

    <div class="auth-footer">
      <a href="login.html">← Wróć do logowania</a>
    </div>
  </div>

</div><!-- /.auth-page -->

<script>
  /**
   * Simulates submitting the password-reset form.
   * In the real app this would POST to an API endpoint.
   * Here we just validate that the field is non-empty and swap the views.
   */
  function submitReset() {
    const email = document.getElementById('email-field').value.trim();
    if (!email) {
      document.getElementById('email-field').focus();
      return;
    }
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('reset-success').classList.remove('hidden');
  }
</script>
</body>
</html>
