<!--
  addMember.html

  CSS:  base.css, components.css, admin.css
  JS:   nav.js  (renders sidebar, provides filterTable / stepper)
-->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalFit — Dodanie członka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
<script>
  const PAGE_ID = 'addMember';
  const ROLE    = 'admin';
</script>

<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">Sal<span>Fit</span></div>
    <span class="topbar-user">Jan Kowalski (admin)</span>
    <a class="topbar-link" href="../login.html">Wyloguj</a>
    <a class="topbar-link" href="../changePassword.html">Zmień hasło</a>
  </header>

  <div class="shell">
    <!-- Sidebar — populated by nav.js renderSidebar() -->
    <nav class="sidebar" id="sidebar"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Dodanie członka</h1>
        <a class="btn btn-ghost back-btn" href="manageMembers.html">← Cofnij</a>
      </div>
      <div class="form-with-sidebar">
        <div class="card">
          <div class="form-grid">
            <div class="form-group"><label class="field-label">Imię <span class="req">*</span></label><input class="field" type="text" placeholder="Imię"></div>
            <div class="form-group"><label class="field-label">Nazwisko <span class="req">*</span></label><input class="field" type="text" placeholder="Nazwisko"></div>
            <div class="form-group"><label class="field-label">E-mail <span class="req">*</span></label><input class="field" type="email" placeholder="adres@email.pl"></div>
            <div class="form-group"><label class="field-label">Numer telefonu</label><input class="field" type="tel" placeholder="000-000-000"></div>
            <div class="form-group"><label class="field-label">Data urodzenia</label><input class="field" type="date"></div>
            <div class="form-group"><label class="field-label">Płeć</label><select class="field"><option value="">Wybierz…</option><option>Kobieta</option><option>Mężczyzna</option><option>Inna</option></select></div>
            <div class="form-group"><label class="field-label">Miasto</label><input class="field" type="text" placeholder="Kraków"></div>
            <div class="form-group"><label class="field-label">Kod pocztowy</label><input class="field" type="text" placeholder="30-001"></div>
            <div class="form-group full"><label class="field-label">Ulica</label><input class="field" type="text" placeholder="ul. Przykładowa 1"></div>
          </div>
          <div class="form-actions">
            <a class="btn btn-ghost" href="manageMembers.html">Anuluj</a>
            <div class="spacer"></div>
            <a class="btn btn-primary" href="manageMembers.html">Zapisz</a>
          </div>
        </div>
        <div class="card">
          <h2 style="font-size:.85rem;margin-bottom:12px">Notatki dla administratora</h2>
          <textarea class="field" rows="5" placeholder="Wewnętrzne notatki…" style="width:100%"></textarea>
          <div style="margin-top:16px;text-align:center">
            <h2 style="font-size:.85rem;margin-bottom:10px">Zdjęcie</h2>
            <div class="avatar-upload" style="margin:0 auto;width:90px;height:90px;font-size:.65rem">
              <div style="font-size:1.2rem">📷</div><div>Dodaj</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../js/nav.js"></script>
</body>
</html>
