<!--
  raports.html

  CSS:  base.css, components.css, admin.css
  JS:   nav.js  (renders sidebar, provides filterTable / stepper)
-->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalFit — Raporty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
<script>
  const PAGE_ID = 'raports';
  const ROLE    = 'admin';
</script>

<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">Sal<span>Fit</span></div>
    <span class="topbar-user">Jan Kowalski (admin)</span>
    <a class="topbar-link" href="../login.html">Wyloguj</a>
    <a class="topbar-link" href="../changePassword.html">Zmień hasło</a>
  </header>

  <div class="shell">
    <!-- Sidebar — populated by nav.js renderSidebar() -->
    <nav class="sidebar" id="sidebar"></nav>

    <main class="main">
      <div class="page-header">
        <h1>Raporty</h1>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary">↓ Eksport CSV</button>
          <button class="btn btn-ghost">↓ Eksport TXT</button>
        </div>
      </div>

      <!-- Summary stats -->
      <div class="stat-grid">
        <div class="stat-card"><div class="val">12</div><div class="lbl">Zajęć w tym tygodniu</div></div>
        <div class="stat-card"><div class="val">38</div><div class="lbl">Aktywnych członków</div></div>
        <div class="stat-card"><div class="val warn">5</div><div class="lbl">Karnety wygasają wkrótce</div></div>
      </div>

      <!-- Two bar-chart cards -->
      <div class="reports-grid">
        <div class="card">
          <h2 class="card-title">Obłożenie sal — tydzień 19–23 maja</h2>
          <div class="progress-row"><div class="progress-label">Sala A</div><div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div><div class="progress-pct">78%</div></div>
          <div class="progress-row"><div class="progress-label">Sala B</div><div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div><div class="progress-pct">50%</div></div>
          <div class="progress-row"><div class="progress-label">Sala C</div><div class="progress-bar"><div class="progress-fill" style="width:20%;background:var(--danger)"></div></div><div class="progress-pct">20%</div></div>
          <div class="progress-row"><div class="progress-label">Sala D</div><div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div><div class="progress-pct">65%</div></div>
        </div>
        <div class="card">
          <h2 class="card-title">Aktywność trenerów</h2>
          <div class="progress-row"><div class="progress-label">Anna K.</div><div class="progress-bar"><div class="progress-fill" style="width:90%;background:var(--teal)"></div></div><div class="progress-pct">9 zaj.</div></div>
          <div class="progress-row"><div class="progress-label">Piotr N.</div><div class="progress-bar"><div class="progress-fill" style="width:60%;background:var(--teal)"></div></div><div class="progress-pct">6 zaj.</div></div>
          <div class="progress-row"><div class="progress-label">Maria W.</div><div class="progress-bar"><div class="progress-fill" style="width:40%;background:var(--teal)"></div></div><div class="progress-pct">4 zaj.</div></div>
          <div class="progress-row"><div class="progress-label">Tomasz B.</div><div class="progress-bar"><div class="progress-fill" style="width:50%;background:var(--teal)"></div></div><div class="progress-pct">5 zaj.</div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../../js/nav.js"></script>
</body>
</html>
