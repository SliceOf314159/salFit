<!--
  changePassword.html — Change password screen.

  Accessible from the "Zmień hasło" link in the topbar of every
  authenticated page. Both admin and trainer users land here.

  The form validates that:
    1. Current password field is non-empty (prototype: any non-empty string).
    2. New password is at least 8 characters.
    3. Confirmation matches the new password.
  On success a confirmation message replaces the form.

  CSS:  base.css, components.css, auth.css
-->
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalFit — Zmiana hasła</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    .hidden  { display: none !important; }

    /* Coloured strength indicator below the new-password field */
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      margin-top: 6px;
      background: var(--border);
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: width .25s, background .25s;
    }
  </style>
</head>
<body>

<div class="auth-page">

  <div class="auth-logo">
    <div class="logo">Sal<span>Fit</span></div>
  </div>

  <div class="auth-card">
    <h2>Zmiana hasła</h2>
    <p class="auth-desc">Aby zmienić hasło, najpierw potwierdź bieżące.</p>

    <!-- ── Error message (shown on validation failure) ─────── -->
    <div id="change-error" class="auth-error hidden"></div>

    <!-- ── Change password form ────────────────────────────── -->
    <div id="change-form">

      <div class="form-group">
        <label class="field-label">Bieżące hasło <span class="req">*</span></label>
        <input id="current-pw" class="field" type="password"
               placeholder="Bieżące hasło" autocomplete="current-password">
      </div>

      <div class="form-group">
        <label class="field-label">Nowe hasło <span class="req">*</span></label>
        <input id="new-pw" class="field" type="password"
               placeholder="Min. 8 znaków"
               autocomplete="new-password"
               oninput="updateStrength(this.value)">
        <!-- Visual strength indicator -->
        <div class="strength-bar">
          <div id="strength-fill" class="strength-fill" style="width:0%"></div>
        </div>
        <span class="password-hint" id="strength-label">Siła hasła: —</span>
      </div>

      <div class="form-group">
        <label class="field-label">Powtórz nowe hasło <span class="req">*</span></label>
        <input id="confirm-pw" class="field" type="password"
               placeholder="Powtórz nowe hasło" autocomplete="new-password">
      </div>

      <button class="btn btn-primary" onclick="submitChange()">
        Zmień hasło
      </button>

    </div><!-- /#change-form -->

    <!-- ── Success message (shown after valid submission) ──── -->
    <div id="change-success" class="hidden">
      <div class="auth-success">
        Hasło zostało zmienione pomyślnie.
      </div>
      <!-- Go back to whichever panel the user came from -->
      <button class="btn btn-ghost" onclick="history.back()">
        ← Powrót do panelu
      </button>
    </div>

    <div class="auth-footer">
      <a href="login.html">← Wróć do logowania</a>
    </div>

  </div><!-- /.auth-card -->
</div><!-- /.auth-page -->

<script>
  /**
   * Updates the password strength bar as the user types.
   * Scoring: length ≥8 (+1), mixed case (+1), digits (+1), symbols (+1).
   */
  function updateStrength(value) {
    let score = 0;
    if (value.length >= 8)                      score++;
    if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
    if (/\d/.test(value))                       score++;
    if (/[^a-zA-Z0-9]/.test(value))            score++;

    const labels = ['—', 'Słabe', 'Średnie', 'Dobre', 'Silne'];
    const colors = ['transparent', '#d03b3b', '#e08c2c', '#2ab5a0', '#1e8a5e'];
    const widths = ['0%', '25%', '50%', '75%', '100%'];

    document.getElementById('strength-fill').style.width      = widths[score];
    document.getElementById('strength-fill').style.background = colors[score];
    document.getElementById('strength-label').textContent     = 'Siła hasła: ' + labels[score];
  }

  /**
   * Validates the form and either shows an error message or the
   * success confirmation.
   */
  function submitChange() {
    const current = document.getElementById('current-pw').value.trim();
    const newPw   = document.getElementById('new-pw').value;
    const confirm = document.getElementById('confirm-pw').value;
    const errorEl = document.getElementById('change-error');

    // Clear previous error
    errorEl.classList.add('hidden');
    errorEl.textContent = '';

    if (!current) {
      showError('Podaj bieżące hasło.');
      return;
    }
    if (newPw.length < 8) {
      showError('Nowe hasło musi mieć co najmniej 8 znaków.');
      return;
    }
    if (newPw !== confirm) {
      showError('Nowe hasło i jego potwierdzenie nie są zgodne.');
      return;
    }

    // In the prototype we just swap views; real app would POST to API.
    document.getElementById('change-form').classList.add('hidden');
    document.getElementById('change-success').classList.remove('hidden');
  }

  function showError(msg) {
    const el = document.getElementById('change-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
</script>
</body>
</html>
